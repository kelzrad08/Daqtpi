<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reverse Video Player</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #222;
            color: #fff;
            margin-top: 50px;
        }
        video {
            width: 640px;
            max-width: 100%;
            border: 2px solid #444;
            border-radius: 8px;
        }
        .controls {
            margin-top: 20px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 5px;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <h1>Reverse Video Player</h1>
    
    <video id="videoPlayer" controls>
        <source src="Drawn To Queen.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>

    <div class="controls">
        <button id="reverseBtn">Play in Reverse</button>
    </div>

    <script>
        const video = document.getElementById('videoPlayer');
        const reverseBtn = document.getElementById('reverseBtn');
        let isReversing = false;
        let reverseInterval;

        reverseBtn.addEventListener('click', () => {
            if (!isReversing) {
                isReversing = true;
                video.pause();
                reverseBtn.textCont = 'Play Forward';
                
                // HTML5 video playbackRate does not reliably support negative values in all browsers.
                // We use an interval to step backward through the video frames.
                reverseInterval = setInterval(() => {
                    if (video.currentTime <= 0) {
                        video.pause();
                        clearInterval(reverseInterval);
                        isReversing = false;
                        reverseBtn.textContent = 'Play in Reverse';
                    } else {
                        video.currentTime -= 0.05; // Adjust speed of reverse here
                    }
                }, 50);
            } else {
                clearInterval(reverseInterval);
                isReversing = false;
                video.play();
                reverseBtn.textContent = 'Play in Reverse';
            }
        });
    </script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <title>YouTube API Embed</title>
</head>
<body>

  <!-- 1. The API will replace this <div> tag with the actual <iframe> video player -->
  <div id="player"></div>

  <script>
    // 2. This code loads the IFrame Player API code asynchronously.
    var tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    var firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

    // 3. This function creates an <iframe> (and YouTube player) after the API code downloads.
    var player;
    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        height: '315',
        width: '560',
        videoId: 'A2GhAUkBRxA', // Replace with your video ID
        playerVars: {
          'playsinline': 1,
          'controls': 1,      // Show player controls
          'rel': 0            // Don't show unrelated videos at the end
        },
        events: {
          'onReady': onPlayerReady,
          'onStateChange': onPlayerStateChange
        }
      });
    }

    // 4. The API will call this function when the video player is ready.
    function onPlayerReady(event) {
      // Example: event.target.playVideo(); // Autoplay if desired
    }

    // 5. The API calls this function when the player's state changes (playing, paused, etc.)
    function onPlayerStateChange(event) {
      if (event.data == YT.PlayerState.PLAYING) {
        console.log("Video is playing!");
      }
    }
  </script>
</body>
</html>

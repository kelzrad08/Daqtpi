<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>6-5-4 Mindful Breathing</title>
    <style>
        :root {
            --bg-color: #1a252f;
            --card-bg: #2c3e50;
            --text-color: #ecf0f1;
            --accent-color: #1abc9c;
            --inhale-color: #3498db;
            --hold-color: #f1c40f;
            --exhale-color: #e74c3c;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            text-align: center;
            width: 350px;
        }

        h1 {
            font-size: 28px;
            margin-top: 0;
            margin-bottom: 5px;
            letter-spacing: 2px;
        }

        .subtitle {
            font-size: 14px;
            color: #bdc3c7;
            margin-bottom: 30px;
        }

        /* Breathing Animation Ring */
        .circle-container {
            position: relative;
            width: 200px;
            height: 200px;
            margin: 0 auto 30px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .breath-circle {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background-color: var(--accent-color);
            opacity: 0.2;
            position: absolute;
            transition: transform 1s linear, background-color 0.5s ease;
        }

        .timer-display {
            font-size: 48px;
            font-weight: bold;
            z-index: 10;
        }

        .status-text {
            font-size: 20px;
            font-weight: 500;
            height: 24px;
            margin-bottom: 25px;
            transition: color 0.5s ease;
        }

        .settings-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.15);
            padding: 12px 20px;
            border-radius: 12px;
            margin-bottom: 25px;
        }

        .cycle-controls button {
            background: #34495e;
            color: white;
            border: none;
            padding: 5px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }

        .cycle-controls button:hover { background: #4e6a85; }
        .cycle-count { font-weight: bold; margin: 0 10px; }

        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            cursor: pointer;
        }

        .btn-group {
            display: flex;
            gap: 15px;
        }

        .main-btn {
            flex: 1;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .start-btn { background: var(--accent-color); color: var(--bg-color); }
        .start-btn:hover { background: #16a085; }
        .reset-btn { background: #7f8c8d; color: white; }
        .reset-btn:hover { background: #95a5a6; }
    </style>
</head>
<body>

<div class="container">
    <h1>6 · 5 · 4 Breathing</h1>
    <div class="subtitle">Inhale · Hold · Exhale</div>

    <div class="circle-container">
        <div id="breathCircle" class="breath-circle"></div>
        <div id="timerDisplay" class="timer-display">0</div>
    </div>

    <div id="statusLabel" class="status-text">Ready</div>

    <div class="settings-panel">
        <div class="cycle-controls">
            <span>Cycles:</span>
            <button onclick="adjustCycles(-1)">−</button>
            <span id="cycleDisplay" class="cycle-count">4</span>
            <button onclick="adjustCycles(1)">+</button>
        </div>
        <label class="checkbox-container">
            <input type="checkbox" id="soundCues" checked> Sound
        </label>
    </div>

    <div class="btn-group">
        <button class="main-btn start-btn" onclick="startBreathing()">Begin</button>
        <button class="main-btn reset-btn" onclick="resetBreathing()">Reset</button>
    </div>
</div>

<script>
    const INHALE_TIME = 6;
    const HOLD_TIME = 5;
    const EXHALE_TIME = 4;

    let totalCycles = 4;
    let currentCycle = 0;
    let timerInterval = null;
    let countdown = 0;

    const statusLabel = document.getElementById("statusLabel");
    const timerDisplay = document.getElementById("timerDisplay");
    const cycleDisplay = document.getElementById("cycleDisplay");
    const soundCues = document.getElementById("soundCues");
    const breathCircle = document.getElementById("breathCircle");

    function playBeep(freq, duration) {
        if (!soundCues.checked) return;
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.frequency.value = freq;
            gainNode.gain.setValueAtTime(0.05, audioCtx.currentTime);
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + duration);
        } catch (e) { console.log("Audio contextual block"); }
    }

    function adjustCycles(amount) {
        if (timerInterval) return;
        totalCycles = Math.max(1, totalCycles + amount);
        cycleDisplay.innerText = totalCycles;
    }

    function startBreathing() {
        if (timerInterval) clearInterval(timerInterval);
        currentCycle = 1;
        runInhalePhase();
    }

    function runInhalePhase() {
        if (currentCycle > totalCycles) {
            statusLabel.innerText = "Breathe easy. You're done.";
            statusLabel.style.color = "var(--text-color)";
            timerDisplay.innerText = "0";
            resetCircle();
            return;
        }
        
        statusLabel.innerText = `Inhale`;
        statusLabel.style.color = "var(--inhale-color)";
        breathCircle.style.backgroundColor = "var(--inhale-color)";
        // Smoothly expand circle over 6 seconds
        breathCircle.style.transition = `transform ${INHALE_TIME}s linear, background-color 0.5s ease`;
        breathCircle.style.transform = "scale(2.2)";
        
        countdown = INHALE_TIME;
        timerDisplay.innerText = countdown;
        playBeep(440, 0.15);

        timerInterval = setInterval(() => {
            countdown--;
            timerDisplay.innerText = countdown;
            if (countdown <= 0) {
                clearInterval(timerInterval);
                runHoldPhase();
            }
        }, 1000);
    }

    function runHoldPhase() {
        statusLabel.innerText = `Hold`;
        statusLabel.style.color = "var(--hold-color)";
        breathCircle.style.backgroundColor = "var(--hold-color)";
        // Maintain exact expanded size during hold
        breathCircle.style.transition = "background-color 0.5s ease";
        
        countdown = HOLD_TIME;
        timerDisplay.innerText = countdown;
        playBeep(523, 0.15);

        timerInterval = setInterval(() => {
            countdown--;
            timerDisplay.innerText = countdown;
            if (countdown <= 0) {
                clearInterval(timerInterval);
                runExhalePhase();
            }
        }, 1000);
    }

    function runExhalePhase() {
        statusLabel.innerText = `Exhale`;
        statusLabel.style.color = "var(--exhale-color)";
        breathCircle.style.backgroundColor = "var(--exhale-color)";
        // Smoothly shrink circle over 4 seconds
        breathCircle.style.transition = `transform ${EXHALE_TIME}s linear, background-color 0.5s ease`;
        breathCircle.style.transform = "scale(1)";
        
        countdown = EXHALE_TIME;
        timerDisplay.innerText = countdown;
        playBeep(587, 0.15);

        timerInterval = setInterval(() => {
            countdown--;
            timerDisplay.innerText = countdown;
            if (countdown <= 0) {
                clearInterval(timerInterval);
                currentCycle++;
                runInhalePhase();
            }
        }, 1000);
    }

    function resetCircle() {
        breathCircle.style.transition = "transform 0.5s ease, background-color 0.5s ease";
        breathCircle.style.transform = "scale(1)";
        breathCircle.style.backgroundColor = "var(--accent-color)";
    }

    function resetBreathing() {
        clearInterval(timerInterval);
        timerInterval = null;
        currentCycle = 0;
        countdown = 0;
        statusLabel.innerText = "Ready";
        statusLabel.style.color = "var(--text-color)";
        timerDisplay.innerText = "0";
        resetCircle();
    }
</script>

</body>
</html>

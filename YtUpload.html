<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dreamscapes Upload</title>

<script src="https://accounts.google.com/gsi/client"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: #f9f9f9;
  color: #111;
}

header {
  height: 72px;
  background: white;
  border-bottom: 1px solid #ddd;
  display: flex;
  align-items: center;
  padding: 0 22px;
  gap: 18px;
  position: sticky;
  top: 0;
  z-index: 10;
}

.youtube-logo {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 26px;
  font-weight: bold;
}

.youtube-icon {
  width: 52px;
  height: 36px;
  background: #ff0000;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.youtube-icon::after {
  content: "";
  width: 0;
  height: 0;
  border-top: 9px solid transparent;
  border-bottom: 9px solid transparent;
  border-left: 14px solid white;
  margin-left: 3px;
}

.header-title {
  font-size: 22px;
  color: #333;
}

.container {
  max-width: 850px;
  margin: 35px auto;
  padding: 0 20px;
}

.card {
  background: white;
  border: 1px solid #ddd;
  border-radius: 14px;
  padding: 28px;
  margin-bottom: 20px;
}

h1 {
  margin-top: 0;
}

label {
  display: block;
  font-weight: bold;
  margin: 20px 0 8px;
}

input[type="text"],
textarea,
select {
  width: 100%;
  padding: 14px;
  border: 1px solid #bbb;
  border-radius: 8px;
  font-size: 16px;
}

textarea {
  min-height: 150px;
  resize: vertical;
}

input[type="file"] {
  width: 100%;
  padding: 12px;
  border: 1px dashed #aaa;
  border-radius: 8px;
  background: #fafafa;
}

.preview {
  width: 100%;
  max-height: 420px;
  object-fit: contain;
  background: #000;
  border-radius: 10px;
  margin-top: 15px;
  display: none;
}

.thumbnail-preview {
  max-width: 100%;
  max-height: 300px;
  display: none;
  margin-top: 15px;
  border-radius: 10px;
}

.radio-group {
  display: flex;
  gap: 15px;
  flex-wrap: wrap;
}

.radio-option {
  flex: 1;
  min-width: 200px;
  border: 1px solid #ccc;
  border-radius: 10px;
  padding: 16px;
}

.radio-option input {
  margin-right: 8px;
}

button {
  border: none;
  border-radius: 8px;
  padding: 14px 22px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

.connect {
  background: #111;
  color: white;
}

.upload {
  background: #065fd4;
  color: white;
  width: 100%;
  margin-top: 25px;
}

.upload:disabled {
  background: #aaa;
  cursor: not-allowed;
}

.status {
  margin-top: 20px;
  padding: 16px;
  border-radius: 10px;
  display: none;
  line-height: 1.5;
}

.status.info {
  display: block;
  background: #eef5ff;
  border: 1px solid #b9d3ff;
}

.status.success {
  display: block;
  background: #eaf8ed;
  border: 1px solid #a8d5b0;
}

.status.warning {
  display: block;
  background: #fff7df;
  border: 1px solid #e5c76b;
}

.status.error {
  display: block;
  background: #fff0f0;
  border: 1px solid #e0a0a0;
}

.progress-wrap {
  margin-top: 20px;
  display: none;
}

.progress-bar {
  width: 100%;
  height: 18px;
  background: #ddd;
  border-radius: 20px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  width: 0%;
  background: #065fd4;
  transition: width .2s;
}

.progress-text {
  margin-top: 8px;
  font-weight: bold;
}

.youtube-link {
  display: inline-block;
  margin-top: 12px;
  padding: 12px 18px;
  background: #ff0000;
  color: white;
  text-decoration: none;
  border-radius: 7px;
  font-weight: bold;
}

.small {
  color: #666;
  font-size: 14px;
  margin-top: 6px;
}

.connected {
  color: #16803c;
  font-weight: bold;
  margin-left: 10px;
}
</style>
</head>

<body>

<header>
  <div class="youtube-logo">
    <div class="youtube-icon"></div>
    <span>YouTube</span>
  </div>

  <div class="header-title">
    Dreamscapes Upload
  </div>
</header>

<div class="container">

  <div class="card">
    <h1>Upload a Dreamscape</h1>

    <button class="connect" id="connectButton" onclick="connectYouTube()">
      Connect YouTube
    </button>

    <span id="connectedText"></span>

    <div id="statusBox" class="status"></div>
  </div>

  <div class="card">

    <label>Video</label>

    <input
      type="file"
      id="videoFile"
      accept="video/*"
      onchange="previewVideo()"
    >

    <video
      id="videoPreview"
      class="preview"
      controls
    ></video>

    <label>Title</label>

    <input
      type="text"
      id="title"
      placeholder="Enter your Dreamscapes video title"
    >

    <label>Description</label>

    <textarea
      id="description"
      placeholder="Enter your YouTube description..."
    ></textarea>

    <label>Thumbnail</label>

    <input
      type="file"
      id="thumbnailFile"
      accept="image/jpeg,image/png"
      onchange="previewThumbnail()"
    >

    <img
      id="thumbnailPreview"
      class="thumbnail-preview"
    >

    <label>Tags</label>

    <input
      type="text"
      id="tags"
      placeholder="dreamscapes, relaxing, fantasy, beautiful places"
    >

    <label>Audience</label>

    <div class="radio-group">

      <div class="radio-option">
        <label>
          <input
            type="radio"
            name="kids"
            value="true"
          >
          Yes, it's made for kids
        </label>
      </div>

      <div class="radio-option">
        <label>
          <input
            type="radio"
            name="kids"
            value="false"
            checked
          >
          No, it's not made for kids
        </label>
      </div>

    </div>

    <label>Visibility</label>

    <select id="visibility">
      <option value="private">Private</option>
      <option value="unlisted" selected>Unlisted</option>
      <option value="public">Public</option>
    </select>

    <div class="progress-wrap" id="progressWrap">

      <div class="progress-bar">
        <div
          class="progress-fill"
          id="progressFill"
        ></div>
      </div>

      <div
        class="progress-text"
        id="progressText"
      >
        Preparing upload...
      </div>

    </div>

    <button
      class="upload"
      id="uploadButton"
      onclick="uploadVideo()"
    >
      Upload to YouTube
    </button>

  </div>

</div>

<script>

/* =========================================================
   DREAMSCAPES YOUTUBE UPLOADER
   ========================================================= */

const CLIENT_ID =
"126333121549-1thsv0th9j8ufi4v6771bmspqric3mrd.apps.googleusercontent.com";

const SCOPES =
"https://www.googleapis.com/auth/youtube.upload";

let accessToken = null;
let tokenClient = null;


/* =========================================================
   GOOGLE LOGIN
   ========================================================= */

window.onload = function () {

  tokenClient = google.accounts.oauth2.initTokenClient({

    client_id: CLIENT_ID,

    scope: SCOPES,

    callback: function(response) {

      if (response.error) {

        showStatus(
          "Google sign-in failed: " + response.error,
          "error"
        );

        return;
      }

      accessToken = response.access_token;

      document.getElementById("connectedText").innerHTML =
        '<span class="connected">✓ YouTube connected</span>';

      document.getElementById("connectButton").innerText =
        "YouTube Connected";

      showStatus(
        "You're connected to YouTube. 🎉 You can upload your Dreamscape!",
        "success"
      );

    }

  });

};


/* =========================================================
   CONNECT
   ========================================================= */

function connectYouTube() {

  if (!tokenClient) {

    showStatus(
      "Google sign-in is still loading. Please try again.",
      "warning"
    );

    return;
  }

  tokenClient.requestAccessToken({
    prompt: "consent"
  });

}


/* =========================================================
   VIDEO PREVIEW
   ========================================================= */

function previewVideo() {

  const file =
    document.getElementById("videoFile").files[0];

  const preview =
    document.getElementById("videoPreview");

  if (!file) {

    preview.style.display = "none";
    return;

  }

  preview.src = URL.createObjectURL(file);
  preview.style.display = "block";

}


/* =========================================================
   THUMBNAIL PREVIEW
   ========================================================= */

function previewThumbnail() {

  const file =
    document.getElementById("thumbnailFile").files[0];

  const preview =
    document.getElementById("thumbnailPreview");

  if (!file) {

    preview.style.display = "none";
    return;

  }

  preview.src = URL.createObjectURL(file);
  preview.style.display = "block";

}


/* =========================================================
   STATUS MESSAGE
   ========================================================= */

function showStatus(message, type) {

  const box =
    document.getElementById("statusBox");

  box.className = "status " + type;

  box.innerHTML = message;

}


/* =========================================================
   UPLOAD VIDEO
   ========================================================= */

async function uploadVideo() {

  try {

    if (!accessToken) {

      showStatus(
        "Please connect your YouTube account first.",
        "warning"
      );

      return;
    }


    const videoFile =
      document.getElementById("videoFile").files[0];

    if (!videoFile) {

      showStatus(
        "Please choose a video first.",
        "warning"
      );

      return;
    }


    const title =
      document.getElementById("title").value.trim();

    if (!title) {

      showStatus(
        "Please enter a title.",
        "warning"
      );

      return;
    }


    const description =
      document.getElementById("description").value;

    const tagsText =
      document.getElementById("tags").value;

    const tags =
      tagsText
        .split(",")
        .map(tag => tag.trim())
        .filter(tag => tag.length > 0);


    const madeForKids =
      document.querySelector(
        'input[name="kids"]:checked'
      ).value === "true";


    const visibility =
      document.getElementById("visibility").value;


    const uploadButton =
      document.getElementById("uploadButton");

    uploadButton.disabled = true;
    uploadButton.innerText = "Uploading...";


    document.getElementById("progressWrap").style.display =
      "block";


    updateProgress(
      0,
      "Preparing YouTube upload..."
    );


    /* =====================================================
       START RESUMABLE UPLOAD
       ===================================================== */

    const metadata = {

      snippet: {

        title: title,

        description: description,

        tags: tags,

        categoryId: "24"

      },

      status: {

        privacyStatus: visibility,

        selfDeclaredMadeForKids: madeForKids

      }

    };


    const initResponse = await fetch(

      "https://www.googleapis.com/upload/youtube/v3/videos" +
      "?uploadType=resumable&part=snippet,status",

      {

        method: "POST",

        headers: {

          "Authorization":
            "Bearer " + accessToken,

          "Content-Type":
            "application/json; charset=UTF-8",

          "X-Upload-Content-Length":
            videoFile.size,

          "X-Upload-Content-Type":
            videoFile.type || "application/octet-stream"

        },

        body: JSON.stringify(metadata)

      }

    );


    if (!initResponse.ok) {

      const errorText =
        await initResponse.text();

      throw new Error(
        "YouTube could not start the upload: " +
        errorText
      );

    }


    const uploadUrl =
      initResponse.headers.get("Location");


    if (!uploadUrl) {

      throw new Error(
        "YouTube did not provide an upload URL."
      );

    }


    /* =====================================================
       UPLOAD VIDEO
       ===================================================== */

    const videoId =
      await sendVideoFile(
        uploadUrl,
        videoFile
      );


    /* =====================================================
       IMPORTANT:
       THE VIDEO IS NOW SUCCESSFULLY UPLOADED.
       ===================================================== */

    updateProgress(
      100,
      "Video uploaded! 🎉 Setting thumbnail..."
    );


    let thumbnailMessage = "";


    /* =====================================================
       THUMBNAIL
       ===================================================== */

    const thumbnailFile =
      document.getElementById("thumbnailFile").files[0];


    if (thumbnailFile) {

      try {

        await setThumbnail(
          videoId,
          thumbnailFile
        );


        thumbnailMessage =
          "<br>🖼️ Thumbnail set successfully!";

      }

      catch (thumbnailError) {

        console.warn(
          "Thumbnail request failed:",
          thumbnailError
        );


        /*
         IMPORTANT:

         We DO NOT call the entire upload a failure.

         The video itself already uploaded successfully.
        */

        thumbnailMessage =
          "<br>⚠️ The video uploaded successfully, " +
          "but the thumbnail could not be confirmed " +
          "from the browser. You can set it in YouTube Studio.";

      }

    }


    /* =====================================================
       SUCCESS
       ===================================================== */

    showStatus(

      "🎉 <strong>Video uploaded successfully!</strong>" +

      thumbnailMessage +

      '<br><br>' +

      '<a class="youtube-link" ' +
      'href="https://www.youtube.com/watch?v=' +
      encodeURIComponent(videoId) +
      '" target="_blank">' +

      "Open Video on YouTube" +

      "</a>",

      thumbnailFile && thumbnailMessage.includes("could not")
        ? "warning"
        : "success"

    );


    updateProgress(
      100,
      "Upload complete! 🎉"
    );


    uploadButton.disabled = false;
    uploadButton.innerText =
      "Upload Another Video";


  }

  catch (error) {

    console.error(error);

    showStatus(

      "❌ Upload could not be completed.<br><br>" +
      "<strong>" +
      escapeHtml(error.message) +
      "</strong>",

      "error"

    );


    document.getElementById("uploadButton").disabled =
      false;

    document.getElementById("uploadButton").innerText =
      "Try Upload Again";

  }

}


/* =========================================================
   SEND VIDEO FILE
   ========================================================= */

function sendVideoFile(uploadUrl, file) {

  return new Promise(function(resolve, reject) {

    const xhr = new XMLHttpRequest();

    xhr.open(
      "PUT",
      uploadUrl,
      true
    );


    xhr.setRequestHeader(
      "Authorization",
      "Bearer " + accessToken
    );


    xhr.setRequestHeader(
      "Content-Type",
      file.type || "application/octet-stream"
    );


    xhr.upload.onprogress =
      function(event) {

        if (event.lengthComputable) {

          const percent =
            Math.round(
              (event.loaded / event.total) * 100
            );

          updateProgress(
            percent,
            "Uploading video... " +
            percent +
            "%"
          );

        }

      };


    xhr.onload =
      function() {

        if (
          xhr.status >= 200 &&
          xhr.status < 300
        ) {

          try {

            const result =
              JSON.parse(xhr.responseText);

            if (result.id) {

              resolve(result.id);

            }

            else {

              reject(
                new Error(
                  "YouTube uploaded the file but did not return a video ID."
                )
              );

            }

          }

          catch (error) {

            reject(
              new Error(
                "YouTube returned an unexpected upload response."
              )
            );

          }

        }

        else {

          reject(
            new Error(
              "YouTube video upload failed (" +
              xhr.status +
              ")."
            )
          );

        }

      };


    xhr.onerror =
      function() {

        reject(
          new Error(
            "The browser lost the connection during the video upload."
          )
        );

      };


    xhr.send(file);

  });

}


/* =========================================================
   SET THUMBNAIL
   ========================================================= */

function setThumbnail(videoId, file) {

  return new Promise(function(resolve, reject) {

    const xhr =
      new XMLHttpRequest();


    const url =
      "https://www.googleapis.com/upload/youtube/v3/thumbnails/set" +
      "?videoId=" +
      encodeURIComponent(videoId);


    xhr.open(
      "POST",
      url,
      true
    );


    xhr.setRequestHeader(
      "Authorization",
      "Bearer " + accessToken
    );


    xhr.setRequestHeader(
      "Content-Type",
      file.type || "image/jpeg"
    );


    xhr.onload =
      function() {

        if (
          xhr.status >= 200 &&
          xhr.status < 300
        ) {

          resolve();

        }

        else {

          reject(
            new Error(
              "Thumbnail request returned HTTP " +
              xhr.status
            )
          );

        }

      };


    xhr.onerror =
      function() {

        reject(
          new Error(
            "Browser could not confirm the thumbnail request."
          )
        );

      };


    xhr.send(file);

  });

}


/* =========================================================
   PROGRESS
   ========================================================= */

function updateProgress(percent, message) {

  document.getElementById("progressFill").style.width =
    percent + "%";

  document.getElementById("progressText").innerText =
    message;

}


/* =========================================================
   HTML ESCAPE
   ========================================================= */

function escapeHtml(text) {

  const div =
    document.createElement("div");

  div.textContent = text;

  return div.innerHTML;

}

</script>

</body>
    </html>

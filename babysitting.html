<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Babysitting Timesheet 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Nunito', sans-serif; background: #F5F3FF; padding: 32px 24px; color: #1f2937; }

  .page { max-width: 860px; margin: 0 auto; background: white; border-radius: 20px; overflow: hidden; box-shadow: 0 4px 24px rgba(91,33,182,0.10); }

  .header { background: linear-gradient(135deg, #7C3AED 0%, #EC4899 60%, #F59E0B 100%); padding: 36px 40px 28px; text-align: center; }
  .header h1 { font-size: 34px; font-weight: 900; color: white; letter-spacing: -0.5px; margin-bottom: 6px; }
  .header p { font-size: 16px; color: rgba(255,255,255,0.88); font-weight: 700; }

  .meta { padding: 20px 40px; background: #faf9ff; border-bottom: 2px solid #ede9fe; display: flex; gap: 40px; flex-wrap: wrap; align-items: center; }
  .meta-field { display: flex; align-items: center; gap: 10px; }
  .meta-field label { font-weight: 800; font-size: 14px; color: #5B21B6; white-space: nowrap; }
  .meta-field input { border: none; border-bottom: 2px solid #A78BFA; background: transparent; font-family: 'Nunito', sans-serif; font-size: 15px; font-weight: 700; color: #1f2937; width: 160px; padding: 2px 4px; outline: none; }
  .meta-field input:focus { border-bottom-color: #7C3AED; }
  .rate-wrap { display: flex; align-items: center; gap: 6px; }
  .rate-wrap span { font-size: 16px; font-weight: 800; color: #5B21B6; }
  .rate-wrap input { width: 70px; text-align: center; }

  .body { padding: 32px 40px; }

  .month-section { margin-bottom: 36px; overflow-x: auto; }
  .month-section table { min-width: 480px; }
  .month-heading { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .month-dot { width: 14px; height: 14px; border-radius: 50%; }
  .month-heading h2 { font-size: 20px; font-weight: 900; }

  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  thead tr th { padding: 10px 10px; text-align: center; font-size: 12px; font-weight: 800; letter-spacing: 0.4px; text-transform: uppercase; color: white; }
  th:first-child { text-align: left; border-radius: 8px 0 0 0; }
  th:last-child { border-radius: 0 8px 0 0; }
  tbody tr td { padding: 8px 10px; text-align: center; border-bottom: 1px solid rgba(0,0,0,0.05); }
  td:first-child { text-align: left; font-weight: 700; }
  .day-badge { display: inline-block; font-size: 11px; font-weight: 800; padding: 2px 9px; border-radius: 10px; }
  tbody tr:last-child td { border-bottom: none; }
  input.cell-input { border: none; border-bottom: 1.5px solid transparent; background: transparent; font-family: 'Nunito', sans-serif; font-size: 13.5px; font-weight: 600; color: #1f2937; width: 80px; text-align: center; padding: 1px 2px; outline: none; transition: border-color 0.15s; }
  input.cell-input:focus { border-bottom-color: #7C3AED; }
  input.notes-input { width: 120px; text-align: left; }
  .pay-cell { font-weight: 800; }
  .total-row td { font-weight: 800; font-size: 13px; padding: 10px 10px; }
  .total-row td:first-child { text-align: right; padding-right: 14px; }

  /* June */
  .jun thead { background: #D97706; }
  .jun .row-thu { background: #FFFBEB; }
  .jun .row-fri { background: #FEF3C7; }
  .jun .thu-badge { background: #FDE68A; color: #78350F; }
  .jun .fri-badge { background: #FCD34D; color: #78350F; }
  .jun .total-row { background: #FEF3C7; color: #92400E; }
  .jun .pay-cell { color: #92400E; }
  .jun .month-dot { background: #F59E0B; }
  .jun .month-heading h2 { color: #B45309; }

  /* July */
  .jul thead { background: #BE185D; }
  .jul .row-thu { background: #FDF2F8; }
  .jul .row-fri { background: #FCE7F3; }
  .jul .thu-badge { background: #FBCFE8; color: #831843; }
  .jul .fri-badge { background: #F9A8D4; color: #831843; }
  .jul .total-row { background: #FCE7F3; color: #831843; }
  .jul .pay-cell { color: #9D174D; }
  .jul .month-dot { background: #EC4899; }
  .jul .month-heading h2 { color: #BE185D; }

  /* August */
  .aug thead { background: #047857; }
  .aug .row-thu { background: #ECFDF5; }
  .aug .row-fri { background: #D1FAE5; }
  .aug .thu-badge { background: #A7F3D0; color: #064E3B; }
  .aug .fri-badge { background: #6EE7B7; color: #064E3B; }
  .aug .total-row { background: #D1FAE5; color: #065F46; }
  .aug .pay-cell { color: #047857; }
  .aug .month-dot { background: #10B981; }
  .aug .month-heading h2 { color: #065F46; }

  /* Grand Total */
  .grand-section { background: #F5F3FF; border-radius: 16px; padding: 24px 28px; margin-top: 8px; }
  .grand-section h2 { font-size: 18px; font-weight: 900; color: #5B21B6; margin-bottom: 16px; }
  .grand-table { width: 100%; border-collapse: collapse; font-size: 14px; }
  .grand-table th { background: #5B21B6; color: white; padding: 9px 12px; text-align: center; font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.4px; }
  .grand-table th:first-child { border-radius: 8px 0 0 0; text-align: left; }
  .grand-table th:last-child { border-radius: 0 8px 0 0; }
  .grand-table td { padding: 9px 12px; text-align: center; border-bottom: 1px solid #DDD6FE; font-weight: 700; }
  .grand-table td:first-child { text-align: left; }
  .grand-table .gtotal-row td { background: #DDD6FE; color: #3B1F6B; font-size: 15px; font-weight: 900; border-bottom: none; }
  .grand-table .gtotal-row td:first-child { border-radius: 0 0 0 8px; }
  .grand-table .gtotal-row td:last-child { border-radius: 0 0 8px 0; }

  .sig { padding: 28px 40px 36px; border-top: 2px solid #EDE9FE; display: flex; gap: 40px; flex-wrap: wrap; }
  .sig-field { display: flex; align-items: center; gap: 10px; }
  .sig-field label { font-size: 13px; font-weight: 800; color: #5B21B6; white-space: nowrap; }
  .sig-field input { border: none; border-bottom: 2px solid #A78BFA; background: transparent; font-family: 'Nunito', sans-serif; font-size: 14px; width: 180px; padding: 2px 4px; outline: none; }
  .sig-field input:focus { border-bottom-color: #7C3AED; }

  .print-bar { background: linear-gradient(135deg, #7C3AED, #EC4899); padding: 0; }
  .print-btn { display: block; width: 100%; padding: 16px; background: transparent; border: none; color: white; font-family: 'Nunito', sans-serif; font-size: 16px; font-weight: 900; cursor: pointer; letter-spacing: 0.3px; }
  .print-btn:hover { opacity: 0.9; }

  @media (max-width: 600px) {
    body { padding: 0; }
    .page { border-radius: 0; }
    .header { padding: 24px 16px 18px; }
    .header h1 { font-size: 20px; }
    .header p { font-size: 12px; }
    .meta { padding: 12px 14px; gap: 12px; }
    .body { padding: 16px 8px; }
    table { font-size: 11.5px; }
    thead tr th { padding: 7px 5px; font-size: 10px; }
    tbody tr td { padding: 6px 5px; }
    input.cell-input { width: 54px; font-size: 11.5px; }
    input.notes-input { width: 60px; }
    .sig { padding: 16px 14px 24px; gap: 16px; }
    .grand-section { padding: 14px 10px; }
    .grand-table td, .grand-table th { padding: 6px 7px; font-size: 11.5px; }
    .month-heading h2 { font-size: 16px; }
  }

  @media print {
    body { background: white; padding: 0; }
    .page { box-shadow: none; border-radius: 0; }
    .print-bar { display: none; }
    input { border-bottom-color: #ccc !important; }
    @page { margin: 0.5in; }
  }
</style>
</head>
<body>
<div class="page">
  <div class="header">
    <h1>🌟 Babysitting Timesheet 2026</h1>
    <p>Summer 2026 &nbsp;·&nbsp; Thursdays &amp; Fridays &nbsp;·&nbsp; July – August</p>
  </div>

  <div class="meta">
    <div class="meta-field">
      <label>Your name:</label>
      <input type="text" placeholder="Enter your name">
    </div>
    <div class="meta-field">
      <label>Hourly rate:</label>
      <div class="rate-wrap">
        <span>$</span>
        <input type="number" id="rate" value="10" min="0" step="0.5" oninput="recalcAll()">
        <span>/hr</span>
      </div>
    </div>
  </div>

  <div class="body">
    <div id="months"></div>

    <div class="grand-section">
      <h2>⭐ Grand Total</h2>
      <table class="grand-table">
        <thead>
          <tr>
            <th>Month</th>
            <th>Days Worked</th>
            <th>Total Hours</th>
            <th>Total Pay</th>
          </tr>
        </thead>
        <tbody>
          <tr id="gt-jul"><td>July</td><td id="gd-1">—</td><td id="gh-1">—</td><td id="gp-1">—</td></tr>
          <tr id="gt-aug"><td>August</td><td id="gd-2">—</td><td id="gh-2">—</td><td id="gp-2">—</td></tr>
          <tr class="gtotal-row">
            <td>TOTAL</td>
            <td id="gd-total">—</td>
            <td id="gh-total">—</td>
            <td id="gp-total">—</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="sig">
    <div class="sig-field">
      <label>Submitted by:</label>
      <input type="text" placeholder="Signature">
    </div>
    <div class="sig-field">
      <label>Date:</label>
      <input type="text" placeholder="MM/DD/YYYY">
    </div>
  </div>

  <div class="print-bar">
    <button class="print-btn" onclick="window.print()">🖨️ Print / Save as PDF</button>
  </div>
</div>

<script>
const MONTHS = [
  { name: 'July',   cls: 'jul', idx: 1 },
  { name: 'August', cls: 'aug', idx: 2 },
];

function getDays() {
  const result = { July: [], August: [] };
  const end = new Date(2026, 8, 1);
  for (let d = new Date(2026, 6, 1); d < end; d.setDate(d.getDate() + 1)) {
    const dow = d.getDay();
    if (dow === 4 || dow === 5) {
      const mn = d.toLocaleString('en-US', { month: 'long' });
      result[mn].push({
        label: d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }),
        day: dow === 4 ? 'Thu' : 'Fri'
      });
    }
  }
  return result;
}

const allDays = getDays();

function buildTables() {
  const container = document.getElementById('months');
  let html = '';
  MONTHS.forEach(({ name, cls, idx }) => {
    const days = allDays[name];
    let rows = '';
    days.forEach((d, i) => {
      const rowCls = d.day === 'Thu' ? 'row-thu' : 'row-fri';
      const badgeCls = d.day === 'Thu' ? 'thu-badge' : 'fri-badge';
      rows += `<tr class="${rowCls}">
        <td>${d.label}</td>
        <td><span class="day-badge ${badgeCls}">${d.day}</span></td>
        <td><input class="cell-input time-input" type="text" placeholder="9
        0:00 AM" data-m="${idx}" data-r="${i}"></td>
        <td><input class="cell-input time-input" type="text" placeholder="0:00 PM" data-m="${idx}" data-r="${i}" data-end="1"></td>
        <td><input class="cell-input hrs-input" type="number" min="0" max="24" step="0.5" placeholder="—" data-m="${idx}" data-r="${i}" oninput="recalcAll()"></td>
        <td><input class="cell-input notes-input" type="text" placeholder="notes…"></td>
        <td class="pay-cell" id="pay-${idx}-${i}">—</td>
      </tr>`;
    });
    html += `<div class="month-section">
      <div class="month-heading">
        <div class="month-dot"></div>
        <h2>${name} 2026</h2>
      </div>
      <table class="${cls}">
        <thead><tr>
          <th>Date</th><th>Day</th><th>Start</th><th>End</th><th>Hours</th><th>Notes</th><th>Pay</th>
        </tr></thead>
        <tbody>
          ${rows}
          <tr class="total-row">
            <td colspan="4">Month total →</td>
            <td id="mh-${idx}">0 hrs</td>
            <td></td>
            <td id="mp-${idx}" class="pay-cell">$0.00</td>
          </tr>
        </tbody>
      </table>
    </div>`;
  });
  container.innerHTML = html;
}

function recalcAll() {
  const rate = parseFloat(document.getElementById('rate').value) || 0;
  let grandDays = 0, grandHrs = 0, grandPay = 0;
  MONTHS.forEach(({ name, idx }) => {
    const days = allDays[name];
    let mHrs = 0, mPay = 0, mDays = 0;
    days.forEach((d, i) => {
      const inp = document.querySelector(`.hrs-input[data-m="${idx}"][data-r="${i}"]`);
      const hrs = inp ? (parseFloat(inp.value) || 0) : 0;
      const pay = hrs * rate;
      const pc = document.getElementById(`pay-${idx}-${i}`);
      if (pc) pc.textContent = hrs > 0 ? '$' + pay.toFixed(2) : '—';
      if (hrs > 0) mDays++;
      mHrs += hrs; mPay += pay;
    });
    grandDays += mDays; grandHrs += mHrs; grandPay += mPay;
    const mhEl = document.getElementById(`mh-${idx}`);
    const mpEl = document.getElementById(`mp-${idx}`);
    if (mhEl) mhEl.textContent = mHrs > 0 ? mHrs.toFixed(1) + ' hrs' : '0 hrs';
    if (mpEl) mpEl.textContent = '$' + mPay.toFixed(2);
    const gdEl = document.getElementById(`gd-${idx}`);
    const ghEl = document.getElementById(`gh-${idx}`);
    const gpEl = document.getElementById(`gp-${idx}`);
    if (gdEl) gdEl.textContent = mDays > 0 ? mDays : '—';
    if (ghEl) ghEl.textContent = mHrs > 0 ? mHrs.toFixed(1) : '—';
    if (gpEl) gpEl.textContent = mPay > 0 ? '$' + mPay.toFixed(2) : '—';
  });
  document.getElementById('gd-total').textContent = grandDays > 0 ? grandDays : '—';
  document.getElementById('gh-total').textContent = grandHrs > 0 ? grandHrs.toFixed(1) : '—';
  document.getElementById('gp-total').textContent = grandPay > 0 ? '$' + grandPay.toFixed(2) : '—';
}

buildTables();
recalcAll();
</script>
</body>
</html>

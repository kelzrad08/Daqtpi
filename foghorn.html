<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FOGHORN</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Black+Han+Sans&display=swap');

  :root {
    --navy: #0a1628;
    --deep: #060e1a;
    --rust: #c0392b;
    --rust-bright: #e74c3c;
    --brass: #d4a017;
    --brass-light: #f0c040;
    --fog: #b0c4d8;
    --steel: #6a8a9f;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--deep);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Bebas Neue', sans-serif;
    overflow: hidden;
    position: relative;
  }

  /* Animated fog layers */
  .fog-layer {
    position: fixed;
    width: 200%;
    height: 120px;
    background: linear-gradient(90deg, transparent, rgba(176,196,216,0.06), transparent);
    border-radius: 50%;
    pointer-events: none;
  }
  .fog-layer:nth-child(1) { top: 10%; animation: driftFog 18s linear infinite; }
  .fog-layer:nth-child(2) { top: 35%; animation: driftFog 24s linear infinite reverse; opacity: 0.6; }
  .fog-layer:nth-child(3) { top: 65%; animation: driftFog 14s linear infinite; opacity: 0.4; }
  .fog-layer:nth-child(4) { bottom: 10%; animation: driftFog 20s linear infinite reverse; opacity: 0.5; }

  @keyframes driftFog {
    0% { transform: translateX(-50%); }
    100% { transform: translateX(0%); }
  }

  /* Sound wave rings */
  .wave-ring {
    position: fixed;
    border-radius: 50%;
    border: 2px solid rgba(176,196,216,0.3);
    transform: translate(-50%, -50%) scale(0);
    left: 50%; top: 50%;
    pointer-events: none;
    opacity: 0;
  }

  @keyframes expandRing {
    0% { transform: translate(-50%, -50%) scale(0.2); opacity: 0.7; }
    100% { transform: translate(-50%, -50%) scale(6); opacity: 0; }
  }

  .wave-ring.blast {
    animation: expandRing 1.8s ease-out forwards;
  }

  /* Title */
  .title {
    color: var(--fog);
    font-size: clamp(2rem, 8vw, 4.5rem);
    letter-spacing: 0.3em;
    text-align: center;
    margin-bottom: 8px;
    opacity: 0.85;
    text-shadow: 0 0 30px rgba(176,196,216,0.3);
    position: relative;
    z-index: 10;
  }

  .subtitle {
    color: var(--steel);
    font-size: clamp(0.7rem, 2vw, 1rem);
    letter-spacing: 0.5em;
    margin-bottom: 40px;
    text-align: center;
    position: relative;
    z-index: 10;
  }

  /* Horn container */
  .horn-wrapper {
    position: relative;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 32px;
  }

  /* SVG Foghorn */
  .foghorn-svg {
    width: clamp(220px, 50vw, 320px);
    filter: drop-shadow(0 8px 32px rgba(0,0,0,0.6));
    transition: transform 0.05s;
  }

  .foghorn-svg.blasting {
    animation: hornShake 0.15s ease-in-out 4;
  }

  @keyframes hornShake {
    0%, 100% { transform: rotate(0deg) translateX(0); }
    25% { transform: rotate(-2deg) translateX(-3px); }
    75% { transform: rotate(2deg) translateX(3px); }
  }

  /* THE BUTTON */
  .trigger-btn {
    width: clamp(100px, 24vw, 150px);
    height: clamp(100px, 24vw, 150px);
    border-radius: 50%;
    border: none;
    cursor: pointer;
    position: relative;
    background: radial-gradient(circle at 35% 35%, #ff5555, var(--rust-bright) 40%, var(--rust) 70%, #7a1a1a);
    box-shadow:
      0 0 0 6px #1a0a0a,
      0 0 0 10px var(--rust),
      0 0 0 14px #1a0a0a,
      0 0 40px rgba(231,76,60,0.5),
      inset 0 -8px 20px rgba(0,0,0,0.4),
      inset 0 4px 10px rgba(255,150,150,0.3);
    transition: transform 0.08s, box-shadow 0.08s;
    -webkit-tap-highlight-color: transparent;
  }

  .trigger-btn::before {
    content: 'BLAST';
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: rgba(255,255,255,0.9);
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(1.2rem, 4vw, 1.8rem);
    letter-spacing: 0.15em;
    text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    border-radius: 50%;
  }

  .trigger-btn:active, .trigger-btn.pressed {
    transform: scale(0.93);
    box-shadow:
      0 0 0 6px #1a0a0a,
      0 0 0 10px var(--rust),
      0 0 0 14px #1a0a0a,
      0 0 60px rgba(231,76,60,0.9),
      inset 0 4px 20px rgba(0,0,0,0.6);
  }

  /* BLASTING text flash */
  .blast-text {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: clamp(4rem, 20vw, 12rem);
    color: var(--fog);
    letter-spacing: 0.1em;
    text-shadow: 0 0 60px rgba(176,196,216,0.8), 0 0 120px rgba(176,196,216,0.4);
    pointer-events: none;
    opacity: 0;
    z-index: 100;
  }

  .blast-text.show {
    animation: blastFlash 1.6s ease-out forwards;
  }

  @keyframes blastFlash {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
    10% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
    30% { opacity: 0.8; }
    100% { opacity: 0; transform: translate(-50%, -50%) scale(1.3); }
  }

  /* Screen flash */
  .flash-overlay {
    position: fixed;
    inset: 0;
    background: rgba(176,196,216,0.15);
    pointer-events: none;
    opacity: 0;
    z-index: 50;
  }
  .flash-overlay.flash {
    animation: screenFlash 0.3s ease-out forwards;
  }
  @keyframes screenFlash {
    0% { opacity: 1; }
    100% { opacity: 0; }
  }

  /* Brass nameplate */
  .nameplate {
    background: linear-gradient(135deg, var(--brass) 0%, var(--brass-light) 40%, var(--brass) 70%, #9a7010 100%);
    color: var(--deep);
    font-size: clamp(0.55rem, 1.5vw, 0.75rem);
    letter-spacing: 0.4em;
    padding: 6px 20px;
    border-radius: 3px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.5), inset 0 1px 2px rgba(255,255,255,0.4);
    margin-top: -16px;
  }
</style>
</head>
<body>

<!-- Fog atmosphere -->
<div class="fog-layer"></div>
<div class="fog-layer"></div>
<div class="fog-layer"></div>
<div class="fog-layer"></div>

<!-- Wave rings (spawned by JS) -->
<div class="wave-ring" id="ring1" style="width:300px;height:300px;"></div>
<div class="wave-ring" id="ring2" style="width:300px;height:300px;animation-delay:0.3s"></div>
<div class="wave-ring" id="ring3" style="width:300px;height:300px;animation-delay:0.6s"></div>

<!-- Flash overlay -->
<div class="flash-overlay" id="flashOverlay"></div>

<!-- Big text -->
<div class="blast-text" id="blastText">HOOOONK</div>

<p class="title">FOGHORN</p>
<p class="subtitle">MARITIME EMERGENCY ALERT SYSTEM</p>

<div class="horn-wrapper">
  <!-- SVG Foghorn illustration -->
  <svg class="foghorn-svg" id="hornSvg" viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg">
    <!-- Mount/base -->
    <rect x="138" y="160" width="44" height="20" rx="4" fill="#1a2a3a" stroke="#2a4a6a" stroke-width="1.5"/>
    <rect x="120" y="175" width="80" height="14" rx="6" fill="#152030" stroke="#2a4a6a" stroke-width="1.5"/>
    <!-- Bolts on base -->
    <circle cx="136" cy="182" r="4" fill="#1a3050" stroke="#d4a017" stroke-width="1.2"/>
    <circle cx="184" cy="182" r="4" fill="#1a3050" stroke="#d4a017" stroke-width="1.2"/>
    <circle cx="160" cy="185" r="3.5" fill="#1a3050" stroke="#d4a017" stroke-width="1.2"/>

    <!-- Main horn body (tapering cylinder) -->
    <path d="M148,160 L148,90 C148,88 150,86 152,85 L168,85 C170,85 172,87 172,90 L172,160 Z"
          fill="url(#hornGrad)" stroke="#2a4a6a" stroke-width="1.5"/>

    <!-- Horn bell - the big flare -->
    <path d="M105,85 C100,80 85,70 72,50 C60,32 55,18 50,8 C65,12 80,22 92,36 C104,50 115,68 118,80 Z"
          fill="url(#bellGrad)" stroke="#1a3050" stroke-width="1.5"/>
    <path d="M215,85 C220,80 235,70 248,50 C260,32 265,18 270,8 C255,12 240,22 228,36 C216,50 205,68 202,80 Z"
          fill="url(#bellGrad)" stroke="#1a3050" stroke-width="1.5"/>

    <!-- Bell opening top arc -->
    <path d="M105,85 C115,75 140,70 160,70 C180,70 205,75 215,85"
          fill="none" stroke="#d4a017" stroke-width="2.5"/>
    <!-- Bell opening inner shadow -->
    <ellipse cx="160" cy="70" rx="55" ry="10" fill="#060e1a" opacity="0.7"/>

    <!-- Sound lines emanating -->
    <g id="soundLines" opacity="0">
      <path d="M160,55 Q130,35 100,20" stroke="rgba(176,196,216,0.6)" stroke-width="2" fill="none" stroke-linecap="round"/>
      <path d="M160,55 Q130,28 90,10" stroke="rgba(176,196,216,0.4)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      <path d="M160,55 Q160,30 160,5" stroke="rgba(176,196,216,0.6)" stroke-width="2" fill="none" stroke-linecap="round"/>
      <path d="M160,55 Q190,30 220,10" stroke="rgba(176,196,216,0.4)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      <path d="M160,55 Q190,35 220,20" stroke="rgba(176,196,216,0.6)" stroke-width="2" fill="none" stroke-linecap="round"/>
    </g>

    <!-- Brass ring details on body -->
    <rect x="148" y="105" width="24" height="5" rx="2" fill="url(#brassGrad)"/>
    <rect x="148" y="120" width="24" height="5" rx="2" fill="url(#brassGrad)"/>
    <rect x="148" y="135" width="24" height="5" rx="2" fill="url(#brassGrad)"/>
    <!-- Body sheen -->
    <rect x="152" y="87" width="6" height="70" rx="3" fill="rgba(255,255,255,0.06)"/>

    <!-- Pressure gauge -->
    <circle cx="160" cy="155" r="10" fill="#0a1628" stroke="#d4a017" stroke-width="1.5"/>
    <circle cx="160" cy="155" r="7" fill="#060e1a"/>
    <line x1="160" y1="155" x2="163" y2="149" stroke="#e74c3c" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="160" cy="155" r="1.5" fill="#d4a017"/>

    <defs>
      <linearGradient id="hornGrad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" style="stop-color:#1a3555"/>
        <stop offset="35%" style="stop-color:#2a5080"/>
        <stop offset="60%" style="stop-color:#1e3d60"/>
        <stop offset="100%" style="stop-color:#0f2035"/>
      </linearGradient>
      <linearGradient id="bellGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#1e3d60"/>
        <stop offset="50%" style="stop-color:#2a5585"/>
        <stop offset="100%" style="stop-color:#0f2035"/>
      </linearGradient>
      <linearGradient id="brassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" style="stop-color:#d4a017"/>
        <stop offset="50%" style="stop-color:#f0c040"/>
        <stop offset="100%" style="stop-color:#9a7010"/>
      </linearGradient>
    </defs>
  </svg>

  <div class="nameplate">⚓ U.S.S. PRANKMASTER ⚓</div>

  <!-- THE TRIGGER BUTTON -->
  <button class="trigger-btn" id="triggerBtn" onclick="blastHorn()"></button>
</div>

<script>
  let audioCtx = null;

  function getAudioCtx() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    return audioCtx;
  }

  function blastHorn() {
    const ctx = getAudioCtx();

    // Foghorn: deep oscillating tone
    const osc1 = ctx.createOscillator();
    const osc2 = ctx.createOscillator();
    const osc3 = ctx.createOscillator();
    const gainNode = ctx.createGain();
    const distortion = ctx.createWaveShaper();

    // Distortion curve for brassy quality
    const curve = new Float32Array(256);
    for (let i = 0; i < 256; i++) {
      const x = (i * 2) / 256 - 1;
      curve[i] = (Math.PI + 300) * x / (Math.PI + 300 * Math.abs(x));
    }
    distortion.curve = curve;

    osc1.type = 'sawtooth';
    osc1.frequency.setValueAtTime(55, ctx.currentTime);
    osc1.frequency.linearRampToValueAtTime(48, ctx.currentTime + 0.3);
    osc1.frequency.linearRampToValueAtTime(52, ctx.currentTime + 1.5);
    osc1.frequency.linearRampToValueAtTime(45, ctx.currentTime + 2.8);

    osc2.type = 'square';
    osc2.frequency.setValueAtTime(110, ctx.currentTime);
    osc2.frequency.linearRampToValueAtTime(96, ctx.currentTime + 0.3);

    osc3.type = 'sine';
    osc3.frequency.setValueAtTime(27, ctx.currentTime);

    gainNode.gain.setValueAtTime(0, ctx.currentTime);
    gainNode.gain.linearRampToValueAtTime(0.9, ctx.currentTime + 0.15);
    gainNode.gain.setValueAtTime(0.85, ctx.currentTime + 2.2);
    gainNode.gain.linearRampToValueAtTime(0, ctx.currentTime + 3.2);

    osc1.connect(distortion);
    osc2.connect(distortion);
    osc3.connect(gainNode);
    distortion.connect(gainNode);
    gainNode.connect(ctx.destination);

    osc1.start(ctx.currentTime);
    osc2.start(ctx.currentTime);
    osc3.start(ctx.currentTime);
    osc1.stop(ctx.currentTime + 3.2);
    osc2.stop(ctx.currentTime + 3.2);
    osc3.stop(ctx.currentTime + 3.2);

    // Visuals
    triggerVisuals();
  }

  function triggerVisuals() {
    const btn = document.getElementById('triggerBtn');
    const horn = document.getElementById('hornSvg');
    const soundLines = document.getElementById('soundLines');
    const flash = document.getElementById('flashOverlay');
    const blastText = document.getElementById('blastText');

    // Button press
    btn.classList.add('pressed');
    setTimeout(() => btn.classList.remove('pressed'), 200);

    // Horn shake
    horn.classList.add('blasting');
    setTimeout(() => horn.classList.remove('blasting'), 700);

    // Sound lines pulse
    soundLines.style.opacity = '1';
    soundLines.style.transition = 'opacity 0.1s';
    setTimeout(() => { soundLines.style.opacity = '0'; }, 2500);

    // Screen flash
    flash.classList.add('flash');
    setTimeout(() => flash.classList.remove('flash'), 400);

    // HOOOONK text
    blastText.classList.remove('show');
    void blastText.offsetWidth;
    blastText.classList.add('show');

    // Expanding rings
    ['ring1','ring2','ring3'].forEach((id, i) => {
      const el = document.getElementById(id);
      el.classList.remove('blast');
      void el.offsetWidth;
      setTimeout(() => el.classList.add('blast'), i * 350);
    });
  }
</script>
</body>
</html>
